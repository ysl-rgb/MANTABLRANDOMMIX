<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>MANTA BL RANDOM MIX</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<link rel="stylesheet" href="style.css?v=11" />
</head>
<body>
<div class="stage" id="stage">
  <div class="card" id="card">
    <img id="mainImage" alt="Manta BL Random Mix" class="main-image" />

    <div class="tooltip-wrap" id="tooltipWrap">
      <div class="tooltip">Click here💜</div>
      <div class="tooltip-tail"></div>
    </div>

    <!-- Invisible hit area over the play/pause button that is already
         drawn into the artwork itself (no button graphic of our own). -->
    <button class="hotspot" id="playBtn" aria-label="Play or pause"></button>

    <div class="confetti" id="confetti"></div>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>

  <div class="sheet" id="sheet" role="dialog" aria-label="Meet your BL today">
    <div class="sheet-handle"></div>
    <p class="sheet-eyebrow">RANDOM MANTA BL FOUND</p>
    <h2 class="sheet-title">Meet Your BL Today!</h2>

    <div class="sheet-actions">
      <button class="pill-btn pill-btn-accent" id="gemsBtn">
        <span class="pill-icon pill-icon-emoji">📖</span>
        <span class="pill-label">Go to Episode 1 &gt;</span>
      </button>

      <button class="pill-btn" id="saveBtn">
        <span class="pill-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12" />
            <path d="M7 10l5 5 5-5" />
            <path d="M5 21h14" />
          </svg>
        </span>
        <span class="pill-label">Download Image</span>
      </button>

      <button class="pill-btn" id="retryBtn">
        <span class="pill-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 0 1 9-9c2.4 0 4.6.94 6.24 2.47M21 12a9 9 0 0 1-9 9c-2.4 0-4.6-.94-6.24-2.47" />
            <path d="M21 3v6h-6" />
            <path d="M3 21v-6h6" />
          </svg>
        </span>
        <span class="pill-label">Shuffle Again</span>
      </button>
    </div>
  </div>
</div>

<audio id="spinSound" src="play-date_short-02_28sec.mp3" preload="auto"></audio>
<div class="toast" id="toast"></div>

<script src="app.js?v=12"></script>
</body>
</html>
